[settings]
default = chrome-main
probe_timeout = 2

[browser chrome-main]
command = google-chrome --profile-directory="Profile 6"

[browser chrome-acme]
command = google-chrome --profile-directory="Profile 9"

[browser chrome-initech]
command = google-chrome --profile-directory="Profile 15"

[browser brave-globex]
command = brave-browser --profile-directory=Default {url}

[browser brave-personal]
command = brave-browser --profile-directory="Profile 1"

[rule cloudflare-acme]
url = ^https://acme\.cloudflareaccess\.com/
browser = chrome-acme

[rule slack-acme]
app = slack
title = - Acme - Slack$
browser = chrome-acme

[rule slack-globex]
app = slack
title = - Globex - Slack$
browser = brave-globex

[rule clickup-initech]
app = desktop|clickup
title = \| Initech( \([^|]*\))?$
browser = chrome-initech

[rule netbird-globex]
app = netbird
probe = netbird profile list
probe_match = ^globex\s+✓
browser = brave-globex
